<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="РЕСКА">
  <meta name="mobile-web-app-capable" content="yes">
  <title>РЕСКА — сообщество</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=__BUILD__">
  <link rel="stylesheet" href="css/redesign.css?v=__BUILD__">
</head>
<body>

  <!-- ============ ЭКРАН ЗАГРУЗКИ ============ -->
  <div id="splash">
      <div class="splash-inner">
        <div class="auth-logo"><span class="logo-star" data-ico="fire"></span>РЕСКА</div>
      <div class="splash-spinner"></div>
      <div class="splash-status" id="splash-status">Загрузка…</div>
      <button class="btn btn-primary hidden" id="splash-retry">Повторить</button>
    </div>
  </div>

  <!-- ============ ИНДИКАТОР СЕТИ ============ -->
  <div id="net-banner" class="net-banner hidden"></div>

  <!-- ============ ЭКРАН АВТОРИЗАЦИИ ============ -->
  <div id="auth-screen" class="hidden">
    <div class="auth-bg"></div>
      <div class="auth-card glass">
        <div class="auth-logo"><span class="logo-star" data-ico="fire"></span>РЕСКА</div>
      <p class="auth-sub">Сообщество. Видео. Чат.</p>
      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>
      <form id="auth-form">
        <div class="field">
          <label>Логин</label>
          <input name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required placeholder="Например: alex">
        </div>
        <div class="field hidden" data-role="register">
          <label>Имя</label>
          <input name="name" autocomplete="name" placeholder="Как вас зовут">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required placeholder="••••••••">
          <div class="forgot-row"><a href="#" id="forgot-link">Забыл пароль?</a></div>
        </div>
        <div class="field hidden" id="captcha-field">
          <label>Проверка: <b id="captcha-question"></b> = ?</label>
          <input name="captcha_answer" inputmode="numeric" autocomplete="off" placeholder="Ответ">
        </div>
        <div class="field hidden" id="totp-field">
          <label>Код из приложения (2FA)</label>
          <input name="totp_code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Войти</button>
      </form>
    </div>
  </div>

  <!-- ============ ВОССТАНОВЛЕНИЕ ПАРОЛЯ ============ -->
  <div id="reset-modal" class="modal-backdrop hidden">
    <div class="modal card">
      <button class="close-x" id="reset-close"></button>
      <h2 class="page-title">Сброс пароля</h2>

      <div id="reset-step-1">
        <div class="field">
          <label>Логин</label>
          <input id="reset-username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Например: alex">
        </div>
        <button id="reset-check" class="btn btn-primary btn-block">Продолжить</button>
      </div>

      <div id="reset-step-2" class="hidden">
        <p class="muted" id="reset-hint"></p>
        <div class="field">
          <label>Код 2FA или резервный код</label>
          <input id="reset-code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
        </div>
        <div class="field">
          <label>Новый пароль</label>
          <input id="reset-new" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••••">
        </div>
        <div class="field">
          <label>Повтори пароль</label>
          <input id="reset-new2" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••••">
        </div>
        <button id="reset-do" class="btn btn-primary btn-block">Сбросить пароль</button>
      </div>

      <div id="reset-done" class="hidden">
        <p class="ok">✓ Пароль изменён. Войди заново.</p>
      </div>

      <div id="reset-msg" class="hidden"></div>
    </div>
  </div>

  <!-- ============ ПРИЛОЖЕНИЕ ============ -->
  <div id="app" class="hidden">

    <!-- ===== ЛЕВЫЙ САЙДБАР ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a class="sidebar-logo" href="#/feed"><span class="logo-star" data-ico="fire"></span>РЕСКА</a>
        <div class="sidebar-stripe"></div>
        <nav class="sidebar-nav">
          <a href="#/feed" data-nav="feed" class="slink">
            <span class="slink-icon" data-ico="home"></span><span class="slink-text">Лента</span>
          </a>
          <a href="#/videos" data-nav="videos" class="slink">
            <span class="slink-icon" data-ico="video"></span><span class="slink-text">Видео</span>
          </a>
          <a href="#/messages" data-nav="messages" class="slink">
            <span class="slink-icon" data-ico="chat"></span><span class="slink-text">Сообщения</span>
            <span id="msg-badge" class="badge hidden">0</span>
          </a>
          <a href="#/calls" data-nav="calls" class="slink">
            <span class="slink-icon" data-ico="phone"></span><span class="slink-text">Звонки</span>
          </a>
          <a href="#/notifications" data-nav="notifications" class="slink">
            <span class="slink-icon" data-ico="bell"></span><span class="slink-text">Уведомления</span>
            <span id="notif-badge" class="badge hidden">0</span>
          </a>
          <a href="#/friends" data-nav="friends" class="slink">
            <span class="slink-icon" data-ico="friends"></span><span class="slink-text">Друзья</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <button class="btn btn-primary sidebar-new-btn" id="new-post-btn"><span class="bn-ico" data-ico="plus"></span>Новый пост</button>
        <div class="sidebar-user">
          <button class="sidebar-user-btn" id="user-menu-btn">
            <img id="nav-avatar" class="avatar" alt="">
            <span id="nav-name" class="sidebar-user-name"></span>
            <span class="sidebar-user-caret" data-ico="chevron"></span>
          </button>
          <div id="user-menu" class="dropdown hidden">
            <a href="#/profile/me"><span class="dm-ico" data-ico="user"></span>Мой профиль</a>
            <a href="#/settings"><span class="dm-ico" data-ico="settings"></span>Настройки</a>
            <a href="#/friends"><span class="dm-ico" data-ico="friends"></span>Друзья</a>
            <a href="#/favorites"><span class="dm-ico" data-ico="star"></span>Избранное</a>
            <a href="#/videos-new"><span class="dm-ico" data-ico="video"></span>Загрузить видео</a>
            <a href="#" data-action="logout"><span class="dm-ico" data-ico="logout"></span>Выйти</a>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- ===== ОСНОВНАЯ ОБЛАСТЬ ===== -->
    <div class="main">
      <header class="topbar">
        <button class="topbar-back hidden" id="btn-back" title="Назад" data-ico="back"></button>
        <button class="menu-toggle hidden" id="menu-toggle" title="Меню"><span data-ico="menu"></span></button>
        <form id="search-form" class="search">
          <span class="search-icon" data-ico="search"></span>
          <input id="search-input" type="search" placeholder="Поиск: посты, видео, люди..." aria-label="Поиск">
        </form>
        <button class="theme-toggle" id="theme-toggle" title="Сменить тему" data-ico="moon"></button>
      </header>
      <main id="view" class="view"></main>
    </div>

    <!-- ===== МОБИЛЬНАЯ НАВИГАЦИЯ (низ) ===== -->
    <nav class="mobilenav" id="mobilenav">
      <a href="#/feed" data-nav="feed"><span class="mn-ico" data-ico="home"></span><span class="mn-txt">Лента</span></a>
      <a href="#/videos" data-nav="videos"><span class="mn-ico" data-ico="video"></span><span class="mn-txt">Видео</span></a>
      <a href="#/messages" data-nav="messages"><span class="mn-ico" data-ico="chat"><span id="msg-badge-mn" class="badge mn-badge hidden">0</span></span><span class="mn-txt">Чат</span></a>
      <a href="#/calls" data-nav="calls"><span class="mn-ico" data-ico="phone"></span><span class="mn-txt">Звонки</span></a>
      <a href="#/notifications" data-nav="notifications"><span class="mn-ico" data-ico="bell"><span id="notif-badge-mn" class="badge mn-badge hidden">0</span></span><span class="mn-txt">Увед.</span></a>
      <a href="#/profile/me" data-nav="profile"><span class="mn-ico" data-ico="user"></span><span class="mn-txt">Профиль</span></a>
    </nav>

    <!-- ===== ПЛАВАЮЩАЯ КНОПКА «+» ===== -->
    <button class="fab" id="fab-main" title="Создать"><span data-ico="plus"></span></button>
    <div class="fab-menu hidden" id="fab-menu">
      <a href="#" data-fab="post"><span class="dm-ico" data-ico="notes"></span>Новый пост</a>
      <a href="#/videos-new" data-fab="video"><span class="dm-ico" data-ico="video"></span>Загрузить видео</a>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- ============ ШАБЛОН ПОСТА ============ -->
  <template id="tpl-post">
    <article class="post card">
      <div class="post-head">
        <a class="post-avatar-link" href="#/profile/"><img class="avatar" alt="аватар"></a>
        <div class="post-meta">
          <a class="post-author" href="#/profile/"></a>
          <span class="post-time muted"></span>
        </div>
        <button class="icon-btn post-del hidden" data-action="del-post" title="Удалить" data-ico="close"></button>
      </div>
      <p class="post-text"></p>
      <div class="post-media-wrap"></div>
      <div class="repost-quote hidden"></div>
      <div class="post-actions">
        <button class="pact" data-action="like">
          <span class="pact-ico" data-ico="heart_o"></span><span class="like-count"></span>
        </button>
        <button class="pact" data-action="react" title="Реакция">
          <span class="pact-ico" data-ico="smile"></span>
        </button>
        <button class="pact" data-action="toggle-comments">
          <span class="pact-ico" data-ico="comment"></span><span class="comment-count"></span>
        </button>
        <button class="pact" data-action="repost" title="Репост">
          <span class="pact-ico" data-ico="repost"></span>
        </button>
        <button class="pact" data-action="more" title="Ещё">
          <span class="pact-ico">⋯</span>
        </button>
        <div class="pact-more" hidden>
          <button class="pact pact-more-item" data-action="share">Поделиться</button>
          <button class="pact pact-more-item" data-action="fav">В избранное</button>
        </div>
      </div>
      <div class="post-reactions"></div>
      <div class="comments-wrap hidden">
        <div class="comments-list"></div>
        <form class="comment-form">
          <img class="avatar sm comment-self-avatar" alt="">
          <input type="text" placeholder="Написать комментарий..." autocomplete="off">
          <button type="submit" class="btn btn-primary btn-sm">➤</button>
        </form>
      </div>
    </article>
  </template>

  <!-- ============ ШАБЛОН ВИДЕО-КАРТОЧКИ ============ -->
  <template id="tpl-video-card">
    <div class="video-card card" data-role="video-card">
      <div class="video-thumb">
        <img alt="превью">
        <span class="video-thumb-play" data-ico="play"></span>
        <span class="views-badge" data-ico="eye"> 0</span>
        <button class="video-fav" data-action="fav" title="В избранное" data-ico="star"></button>
        <button class="video-del hidden" data-action="video-del" title="Удалить" data-ico="close"></button>
      </div>
      <div class="video-info">
        <h3 class="video-title"></h3>
        <p class="video-author muted"></p>
      </div>
    </div>
  </template>

  <!-- ============ КОММЕНТАРИИ-ЛИСТ (bottom sheet) ============ -->
  <template id="tpl-comments-sheet">
    <div class="comments-sheet" data-role="comments-sheet">
      <div class="comments-sheet-backdrop"></div>
      <div class="comments-sheet-panel glass">
        <div class="comments-sheet-head">
          <span class="comments-sheet-count">Комментарии</span>
          <button class="comments-sheet-close" data-ico="close"></button>
        </div>
        <div class="comments-sheet-list"></div>
        <div class="comments-sheet-form">
          <input type="text" name="comment" placeholder="Добавить комментарий..." autocomplete="off">
          <button type="submit" class="btn btn-primary btn-sm">➤</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ ШАБЛОН СООБЩЕНИЯ ============ -->
  <template id="tpl-message">
    <div class="msg">
      <div class="msg-bubble"></div>
      <span class="msg-time muted"></span>
    </div>
  </template>

  <!-- ============ ШАБЛОН КОММЕНТАРИЯ ============ -->
  <template id="tpl-comment">
    <div class="comment">
      <img class="avatar sm" alt="аватар">
      <div class="comment-body">
        <a class="comment-author" href="#/profile/"></a>
        <p class="comment-text"></p>
        <button class="reply-btn">Ответить</button>
        <form class="reply-form hidden">
          <input type="text" placeholder="Ответить..." autocomplete="off">
          <button class="btn btn-primary btn-sm" type="submit">➤</button>
        </form>
      </div>
      <div class="comment-replies"></div>
    </div>
  </template>

  <script src="/socket.io/socket.io.js"></script>
  <script src="icons.js?v=__BUILD__"></script>
  <script src="app.js?v=__BUILD__"></script>
</body>
</html>
